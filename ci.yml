schemaVersion: v0.4

# Setup that runs before the app is deployed.
prepare:
  steps:
    - name: Install yt-dlp (for the audio download button)
      # Codesphere's Python is an externally-managed (PEP 668) env, so pip needs
      # --break-system-packages. The container is disposable, so this is safe.
      # Non-fatal: if it still can't install, the app deploys and only the
      # Download button is unavailable.
      command: python3 -m pip install --upgrade --break-system-packages yt-dlp || python3 -m pip install --upgrade --user --break-system-packages yt-dlp || true
    - name: Install ffmpeg (mp3 conversion for downloads; best-effort)
      # yt-dlp needs ffmpeg to transcode to mp3. Codesphere restricts apt, so use
      # the Nix package manager. Best-effort — the core app (digging, playback,
      # filters) doesn't depend on it.
      command: command -v ffmpeg >/dev/null 2>&1 || nix-env -iA nixpkgs.ffmpeg || (nix-channel --update && nix-env -iA nixpkgs.ffmpeg) || true

# Verification that runs after prepare.
test:
  steps:
    - name: Syntax-check the server
      command: python3 -m py_compile server.py

# Deploy target: the Python server, serving the app on the main route "/".
run:
  cratedigger:
    steps:
      - name: Start Crate Digger
        command: python3 server.py
    plan: 21
    healthEndpoint: http://localhost:3000/health
    network:
      ports:
        - port: 3000
          isPublic: false
      paths:
        - port: 3000
          path: /
    env:
      PORT: "3000"
      HOST: "0.0.0.0"
