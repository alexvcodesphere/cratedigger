<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crate Digger — Pull</title>
<!-- v2 UI. The original app is preserved untouched in sample-digger.html. -->
<style>
  :root {
    --bg: #0e1420;
    --panel: #151d2c;
    --card: #1b2536;
    --card-hi: #223047;
    --line: rgba(255,255,255,.06);
    --line-hi: rgba(255,255,255,.13);
    --text: #eef2f8;
    --muted: #7d8aa0;
    --brand1: #7c5cff;
    --brand2: #4d9fff;
    --dyn1: #7c5cff;          /* dynamic, extracted from cover art */
    --dyn2: #4d9fff;
    --win: #00e07f;
    --common: #8fa0b8;
    --rare: #3fa9ff;
    --epic: #a06bff;
    --legendary: #ffb930;
    --r-lg: 18px;
    --r-md: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(900px 400px at 50% -8%, color-mix(in srgb, var(--dyn1) 12%, transparent), transparent 70%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Inter, sans-serif;
    letter-spacing: -.006em;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background .8s;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand2); outline-offset: 2px; }
  a { color: var(--brand2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ================= top bar ================= */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(14,20,32,.85);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 30;
  }
  .logo { font-weight: 800; font-size: 16px; letter-spacing: -.03em; display: flex; align-items: center; gap: 9px; margin-right: 8px; }
  .logo .mark {
    width: 25px; height: 25px; border-radius: 8px;
    background: linear-gradient(135deg, var(--dyn1), var(--dyn2));
    display: grid; place-items: center;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--dyn1) 40%, transparent);
    transition: background .8s;
  }
  .logo .mark::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2.5px solid #fff; }
  .pill {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pill .lbl { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  .pill.streak b { color: var(--legendary); }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .token-box { display: flex; align-items: center; gap: 7px; }
  .token-box .hint { font-size: 11px; color: var(--muted); cursor: help; }
  .token-box input {
    width: 120px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    color: var(--text);
    font: 12px inherit;
  }
  .token-box input::placeholder { color: var(--muted); }
  .ghost-btn {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    transition: color .15s, border-color .15s, background .15s;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--line-hi); background: var(--panel); }
  .ghost-btn .key {
    font-size: 10px; background: rgba(255,255,255,.07);
    border-radius: 4px; padding: 1px 5px; margin-left: 4px;
  }

  /* ================= layout ================= */
  .shell {
    width: min(1280px, 100%);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    padding: 16px 20px 40px;
    align-items: start;
  }
  .main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

  /* ---------- pull ribbon ---------- */
  .ribbon-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
    position: relative;
  }
  .window {
    position: relative;
    height: 96px;
    overflow: hidden;
    -webkit-mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }
  .ribbon {
    position: absolute; top: 12px; left: 0;
    display: flex; gap: 10px;
    will-change: transform;
  }
  .rcard {
    flex: 0 0 72px;
    width: 72px; height: 72px;
    border-radius: 10px;
    position: relative;
    display: flex; align-items: flex-end;
    padding: 6px;
    border: 1px solid rgba(255,255,255,.09);
    overflow: hidden;
    background-size: cover; background-position: center;
  }
  .rcard span {
    font-size: 8.5px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 5px rgba(0,0,0,.7);
    line-height: 1.2;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .rcard::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px;
    background: var(--rc, transparent);
  }
  .ribbon.spinning { animation: drift 1.1s linear infinite; filter: blur(1.2px); }
  .ribbon.idle { animation: drift 60s linear infinite; }
  @keyframes drift { to { transform: translateX(-820px); } }
  .marker {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 2px; margin-left: -1px;
    background: linear-gradient(180deg, transparent, var(--dyn2) 25%, var(--dyn1) 75%, transparent);
    z-index: 5; pointer-events: none;
    transition: background .8s;
  }
  .marker::before, .marker::after {
    content: ""; position: absolute; left: 50%;
    border: 4px solid transparent; transform: translateX(-50%);
  }
  .marker::before { top: 0; border-top-color: var(--dyn2); }
  .marker::after { bottom: 0; border-bottom-color: var(--dyn1); }

  /* ---------- player ---------- */
  .player-wrap {
    position: relative;
    background: #000;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
    aspect-ratio: 16 / 9;
  }
  .player-wrap iframe, .player-wrap #yt { position: absolute; inset: 0; width: 100%; height: 100%; }
  #status {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    background: linear-gradient(180deg, #131b29, #0e1420);
    color: var(--muted); font-size: 14px;
    text-align: center; padding: 20px;
  }
  #status b { color: var(--text); }
  .dig-line { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
  .dig-line span { color: var(--dyn1); transition: color .3s; }

  /* ---------- lower third ---------- */
  .lower-third {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--dyn1);
    border-radius: var(--r-md);
    padding: 10px 16px;
    transition: border-color .8s;
  }
  .lt-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--card); flex: 0 0 auto; }
  .lt-text { min-width: 0; flex: 1; }
  .lt-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; }
  .lt-title .inner { display: inline-block; }
  .lt-title.scroll .inner { animation: marquee var(--marquee, 14s) linear infinite; }
  @keyframes marquee { to { transform: translateX(-50%); } }
  .lt-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq { display: flex; align-items: flex-end; gap: 2.5px; height: 16px; flex: 0 0 auto; opacity: .25; }
  body.playing .eq { opacity: 1; }
  .eq i { width: 3px; background: linear-gradient(180deg, var(--dyn2), var(--dyn1)); border-radius: 2px; height: 60%; }
  body.playing .eq i { animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { height: 100%; animation-delay: .18s }
  .eq i:nth-child(3) { height: 45%; animation-delay: .32s }
  .eq i:nth-child(4) { height: 80%; animation-delay: .5s }
  @keyframes eq { 50% { transform: scaleY(.35) } }
  .lt-bpm { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .lt-bpm small { color: var(--muted); font-weight: 500; font-size: 10px; letter-spacing: .1em; }

  /* ---------- dock ---------- */
  .dock { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .dock-btn {
    display: flex; align-items: center; gap: 7px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 11px 16px;
    font-size: 13px; font-weight: 600;
    color: var(--muted);
    transition: color .15s, border-color .15s, background .15s, transform .1s;
  }
  .dock-btn:hover { color: var(--text); border-color: var(--line-hi); background: var(--card-hi); }
  .dock-btn:active { transform: scale(.95); }
  .dock-btn .key { font-size: 10px; background: rgba(255,255,255,.07); border-radius: 4px; padding: 1px 5px; }
  .dock-btn.faved { color: #ff5c8a; border-color: rgba(255,92,138,.4); }
  .dock-btn.pop { animation: favpop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes favpop { 40% { transform: scale(1.18); } }
  .dig-btn {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, var(--dyn1), var(--dyn2));
    border-radius: 14px;
    padding: 14px 38px;
    font-size: 16px; font-weight: 800; letter-spacing: -.01em;
    color: #fff;
    box-shadow: 0 10px 30px color-mix(in srgb, var(--dyn1) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .12s, filter .15s, background .8s;
  }
  .dig-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .dig-btn:active { transform: scale(.95); }
  .dig-btn:disabled { opacity: .6; filter: saturate(.6); cursor: default; transform: none; }
  .dig-btn .key { font-size: 11px; font-weight: 700; background: rgba(0,0,0,.25); border-radius: 6px; padding: 3px 7px; }

  /* ---------- collapsible cards ---------- */
  .fold {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px 20px;
    display: none;
  }
  .fold.open { display: block; animation: foldin .25s cubic-bezier(.2,1.1,.4,1); }
  @keyframes foldin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .filter-grid label {
    display: block;
    font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .filter-grid input, .filter-grid select {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--text);
    font: 13px inherit;
  }
  .filter-grid input::placeholder { color: var(--muted); }
  .year-pair { display: flex; gap: 8px; }
  .bpm-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  #bpm-pulse {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--dyn1);
    opacity: .3;
  }
  #bpm-pulse.beat { animation: beat var(--beat, .6s) ease-out infinite; }
  @keyframes beat { 0% { opacity: 1; transform: scale(1.5); } 100% { opacity: .3; transform: scale(1); } }
  #bpm-val { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #bpm-val small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .btn-primary {
    background: linear-gradient(135deg, var(--dyn1), var(--dyn2));
    border-radius: var(--r-md);
    padding: 11px 26px;
    font-weight: 700; font-size: 14px;
    color: #fff;
    transition: transform .12s, filter .15s;
  }
  .btn-primary:active { transform: scale(.95); }
  .hint { font-size: 12px; color: var(--muted); }

  /* ================= side ================= */
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .meta-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .meta-card.swap { animation: metaswap .45s cubic-bezier(.2,1.1,.4,1); }
  @keyframes metaswap { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .meta-card .cover-wrap { position: relative; margin-bottom: 14px; }
  .meta-card .cover {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: var(--r-md);
    background: var(--card);
    display: block;
  }
  .tier {
    position: absolute; top: 10px; left: 10px;
    font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    border-radius: 999px;
    padding: 4px 11px;
    backdrop-filter: blur(8px);
    display: none;
  }
  .tier.show { display: inline-block; animation: tierpop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes tierpop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tier.common { background: rgba(143,160,184,.25); color: #dbe4ef; }
  .tier.rare { background: rgba(63,169,255,.3); color: #bfe1ff; }
  .tier.epic { background: rgba(160,107,255,.32); color: #ddc8ff; }
  .tier.legendary { background: rgba(255,185,48,.32); color: #ffe1a0; }
  .m-artist { font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  .m-title { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .chip {
    font-size: 11px; font-weight: 600;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3.5px 10px;
    color: var(--muted);
  }
  .chip.hot {
    background: color-mix(in srgb, var(--dyn1) 18%, transparent);
    border-color: color-mix(in srgb, var(--dyn1) 45%, transparent);
    color: var(--text);
  }
  .meta-rows { margin-top: 13px; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; }
  .meta-row { display: flex; gap: 10px; }
  .meta-row .k { color: var(--muted); flex: 0 0 62px; }
  .cover:not([src]), .lt-thumb:not([src]) { visibility: hidden; }
  .meta-row .v { min-width: 0; overflow-wrap: anywhere; }

  .list-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button {
    flex: 1;
    padding: 12px;
    font-size: 12.5px; font-weight: 700;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tabs button.active { color: var(--text); border-bottom-color: var(--dyn1); }
  #list { max-height: 380px; overflow-y: auto; }
  .track {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    transition: background .12s;
  }
  .track:hover { background: var(--card); }
  .track.now { background: color-mix(in srgb, var(--dyn1) 10%, transparent); }
  .track img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: var(--card); flex: 0 0 auto; }
  .track .t { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .a { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track > div:last-child { min-width: 0; }
  .track .mini-tier { margin-left: auto; flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; }
  .empty { padding: 26px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* ================= misc ================= */
  .toast {
    position: fixed; bottom: 26px; left: 50%;
    transform: translate(-50%, 20px);
    background: var(--card-hi);
    border: 1px solid var(--line-hi);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px; font-weight: 600;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    z-index: 70;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

  /* stream mode: clean capture layout */
  body.stream .topbar, body.stream .side, body.stream .fold, body.stream .ribbon-panel { display: none; }
  body.stream .shell { grid-template-columns: 1fr; max-width: 1080px; padding-top: 24px; }
  body.stream .dock { display: none; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ribbon.idle, .ribbon.spinning { animation: none; filter: none; }
    body.playing .eq i { animation: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><span class="mark"></span>cratedigger</div>
  <div class="pill"><span class="lbl">Pulls</span><b id="stat-pulls">0</b></div>
  <div class="pill streak"><span class="lbl">🔥 Streak</span><b id="stat-streak">0</b></div>
  <div class="top-right">
    <div class="token-box">
      <span class="hint" title="Optional. Raises the Discogs rate limit from 25 to 60 requests/min. Get one free at discogs.com → Settings → Developers.">Discogs token</span>
      <input id="token" type="password" placeholder="paste token…" autocomplete="off">
    </div>
    <button class="ghost-btn" id="btn-stream" title="Clean layout for streams / screen recordings">Stream mode <span class="key">V</span></button>
  </div>
</header>

<div class="shell">
  <div class="main">

    <div class="ribbon-panel">
      <div class="window">
        <div class="marker"></div>
        <div class="ribbon idle" id="ribbon"></div>
      </div>
    </div>

    <div class="player-wrap">
      <div id="status"><div>Press <b>Dig</b> (or hit D) to pull a track from the crates.</div></div>
      <div id="yt"></div>
    </div>

    <div class="lower-third" id="lowerthird">
      <img class="lt-thumb" id="lt-cover" alt="">
      <div class="lt-text">
        <div class="lt-title" id="lt-title"><span class="inner" id="lt-title-inner">Nothing playing yet</span></div>
        <div class="lt-sub" id="lt-sub">hit D to dig</div>
      </div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="lt-bpm" id="lt-bpm">— <small>BPM</small></div>
    </div>

    <div class="dock">
      <button class="dock-btn" id="btn-filters">Filters <span class="key">S</span></button>
      <button class="dock-btn" id="btn-tempo">Tap tempo <span class="key">R</span></button>
      <button class="dig-btn" id="btn-random">Dig <span class="key">D</span></button>
      <button class="dock-btn" id="btn-play">Play / pause <span class="key">␣</span></button>
      <button class="dock-btn" id="btn-copy">Copy link <span class="key">C</span></button>
      <button class="dock-btn" id="btn-fav">♥ <span class="key">F</span></button>
    </div>

    <div class="fold" id="filters">
      <div class="filter-grid">
        <div>
          <label>Genre</label>
          <select id="f-genre">
            <option value="">Any</option>
            <option>Funk / Soul</option>
            <option>Jazz</option>
            <option>Electronic</option>
            <option>Hip Hop</option>
            <option>Rock</option>
            <option>Latin</option>
            <option>Reggae</option>
            <option>Pop</option>
            <option>Blues</option>
            <option>Folk, World, & Country</option>
            <option>Stage & Screen</option>
            <option>Classical</option>
          </select>
        </div>
        <div>
          <label>Style</label>
          <input id="f-style" list="styles" placeholder="Any">
          <datalist id="styles">
            <option>Soul</option><option>Funk</option><option>Disco</option>
            <option>Boogie</option><option>Rhythm & Blues</option><option>Afrobeat</option>
            <option>Soul-Jazz</option><option>Jazz-Funk</option><option>Fusion</option>
            <option>Psychedelic Rock</option><option>Bossa Nova</option><option>MPB</option>
            <option>Salsa</option><option>Highlife</option><option>Gospel</option>
            <option>Breaks</option><option>Downtempo</option><option>Dub</option>
            <option>Rocksteady</option><option>Freestyle</option><option>Italo-Disco</option>
            <option>Soundtrack</option><option>Library</option>
          </datalist>
        </div>
        <div>
          <label>Years</label>
          <div class="year-pair">
            <input id="f-year-from" type="number" min="1900" max="2026" placeholder="from" value="1965">
            <input id="f-year-to" type="number" min="1900" max="2026" placeholder="to" value="1985">
          </div>
        </div>
        <div>
          <label>Country</label>
          <input id="f-country" placeholder="Any (e.g. US, Brazil…)">
        </div>
        <div>
          <label>Format</label>
          <select id="f-format">
            <option value="Vinyl">Vinyl only</option>
            <option value="">Any format</option>
          </select>
        </div>
      </div>
    </div>

    <div class="fold" id="bpm-box">
      <div class="bpm-wrap">
        <div id="bpm-pulse"></div>
        <div id="bpm-val">— <small>BPM</small></div>
        <button id="btn-tap" class="btn-primary">TAP (R)</button>
        <button class="dock-btn" id="btn-tap-reset">Reset</button>
        <span class="hint">Tap along with the beat. Last 8 taps are averaged.</span>
      </div>
    </div>
  </div>

  <aside class="side">
    <div class="meta-card" id="meta">
      <div class="cover-wrap">
        <img class="cover" id="cover" alt="Cover art">
        <span class="tier" id="tier-badge">Common</span>
      </div>
      <div class="m-artist" id="m-artist-big">—</div>
      <div class="m-title" id="m-title">—</div>
      <div class="chips" id="m-chips"></div>
      <div class="meta-rows">
        <div class="meta-row"><span class="k">Release</span><span class="v" id="m-release">—</span></div>
        <div class="meta-row"><span class="k">Label</span><span class="v" id="m-label">—</span></div>
        <div class="meta-row"><span class="k">Owned by</span><span class="v" id="m-community">—</span></div>
        <div class="meta-row"><span class="k">Links</span><span class="v" id="m-links">—</span></div>
      </div>
    </div>

    <div class="list-card">
      <div class="tabs">
        <button id="tab-history" class="active">History</button>
        <button id="tab-favs">Favorites</button>
      </div>
      <div id="list"><div class="empty">Nothing dug up yet.</div></div>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
const $ = id => document.getElementById(id);
const API = 'https://api.discogs.com';

/* ---------- state ---------- */
let current = null;
let history = [];
let favs = JSON.parse(localStorage.getItem('digger_favs') || '[]');
let activeTab = 'history';
let player = null, playerReady = false;
let digging = false;
let pulls = parseInt(localStorage.getItem('digger_pulls') || '0');
let streak = 0;
$('stat-pulls').textContent = pulls;

$('token').value = localStorage.getItem('digger_token') || '';
$('token').addEventListener('change', e => localStorage.setItem('digger_token', e.target.value.trim()));

/* ---------- discogs api ---------- */
function apiHeaders() {
  const t = $('token').value.trim();
  return t ? { 'Authorization': 'Discogs token=' + t } : {};
}
async function api(url) {
  const res = await fetch(url, { headers: apiHeaders() });
  if (res.status === 429) throw new Error('rate');
  if (!res.ok) throw new Error('http ' + res.status);
  return res.json();
}

function filterParams(year) {
  const p = new URLSearchParams({ type: 'release', per_page: '25' });
  const g = $('f-genre').value, s = $('f-style').value.trim(),
        c = $('f-country').value.trim(), f = $('f-format').value;
  if (g) p.set('genre', g);
  if (s) p.set('style', s);
  if (c) p.set('country', c);
  if (f) p.set('format', f);
  if (year) p.set('year', year);
  return p;
}
function randomYear() {
  let a = parseInt($('f-year-from').value), b = parseInt($('f-year-to').value);
  if (isNaN(a) && isNaN(b)) return null;
  if (isNaN(a)) a = b; if (isNaN(b)) b = a;
  if (a > b) [a, b] = [b, a];
  return a + Math.floor(Math.random() * (b - a + 1));
}

/* pool of candidate releases for the current filter set */
let pool = [], poolKey = '', rollsSinceRefill = 0;
const countCache = {};

async function refillPool() {
  const year = randomYear();
  const params = filterParams(year);
  const key = params.toString();

  let pages = countCache[key];
  if (pages === undefined) {
    const probe = new URLSearchParams(params); probe.set('per_page', '1');
    const d = await api(API + '/database/search?' + probe);
    const items = d.pagination.items;
    if (!items) { countCache[key] = 0; return false; }
    pages = Math.min(Math.ceil(items / 25), 400);   // Discogs caps paging at 10k items
    countCache[key] = pages;
  }
  if (pages === 0) return false;

  const page = 1 + Math.floor(Math.random() * pages);
  const d = await api(API + '/database/search?' + params + '&page=' + page);
  pool = d.results || [];
  poolKey = baseKey();
  rollsSinceRefill = 0;
  return pool.length > 0;
}
function baseKey() { return filterParams(null).toString(); }

/* ---------- rarity: real Discogs collection stats ---------- */
/* score = want / have — how much more the record is wanted than owned */
function rarityOf(rel) {
  const c = rel.community || {};
  const have = c.have || 0, want = c.want || 0;
  if (!have && !want) return 'common';
  const score = want / (have + 1);
  if (score >= 1.2 || (have < 30 && want > 20)) return 'legendary';
  if (score >= 0.7) return 'epic';
  if (score >= 0.35) return 'rare';
  return 'common';
}
const TIER_COLOR = { common: '#8fa0b8', rare: '#3fa9ff', epic: '#a06bff', legendary: '#ffb930' };

/* ---------- pull ribbon ---------- */
const ribbon = $('ribbon');
const RIB_STEP = 82;   // card width 72 + gap 10
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RIB_WORDS = ['Funk', 'Soul', 'Jazz', 'Disco', 'Boogie', 'Psych', 'Breaks', 'Dub', 'Latin', 'Afrobeat', 'Gospel', 'Library', 'MPB', 'Highlife', 'Fusion', 'Salsa'];
function ribCard(text, hue, cover, tier) {
  const bg = cover
    ? `background-image:url('${cover}')`
    : `background:linear-gradient(150deg, hsl(${hue} 55% 45%), hsl(${(hue + 45) % 360} 65% 20%))`;
  return `<div class="rcard" style="${bg};--rc:${TIER_COLOR[tier || 'common']}"><span>${text}</span></div>`;
}
function ribbonIdle() {
  let html = '';
  for (let i = 0; i < 30; i++) {
    html += ribCard(RIB_WORDS[i % RIB_WORDS.length], (i * 47) % 360, null, ['common', 'common', 'rare', 'common', 'epic'][i % 5]);
  }
  ribbon.innerHTML = html;
  ribbon.className = 'ribbon idle';
  ribbon.style.transition = 'none';
  ribbon.style.transform = 'translateX(0)';
}
ribbonIdle();
function ribbonSpin() { ribbon.className = 'ribbon spinning'; }
function ribbonLand(track, tier) {
  return new Promise(resolve => {
    const N = 22, WIN = 17;
    let html = '';
    for (let i = 0; i < N; i++) {
      if (i === WIN) html += ribCard(track.release, 0, track.cover || ('https://i.ytimg.com/vi/' + track.videoId + '/hqdefault.jpg'), tier);
      else html += ribCard(RIB_WORDS[(Math.random() * RIB_WORDS.length) | 0], (Math.random() * 360) | 0, null, 'common');
    }
    ribbon.className = 'ribbon';
    ribbon.innerHTML = html;
    ribbon.style.transition = 'none';
    ribbon.style.transform = 'translateX(0)';
    if (reduceMotion) { resolve(); return; }
    void ribbon.offsetWidth;
    const center = ribbon.parentElement.clientWidth / 2;
    const target = -(WIN * RIB_STEP + 36 - center);
    ribbon.style.transition = 'transform 950ms cubic-bezier(.12,.75,.15,1)';
    ribbon.style.transform = `translateX(${target}px)`;
    setTimeout(resolve, 960);
  });
}

/* ---------- dig ---------- */
async function dig() {
  if (digging) return;
  digging = true;
  const btn = $('btn-random');
  btn.disabled = true;
  showDigging();
  ribbonSpin();

  try {
    let emptyRefills = 0;
    for (let attempt = 0; attempt < 10; attempt++) {
      if (pool.length === 0 || poolKey !== baseKey() || rollsSinceRefill >= 5) {
        const ok = await refillPool();
        if (!ok && ++emptyRefills >= 3) { setStatus('No results for these filters — try loosening them.'); ribbonIdle(); return; }
        if (!ok) continue;
      }
      const item = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      rollsSinceRefill++;
      const rel = await api(item.resource_url);
      const vids = (rel.videos || []).filter(v => v.embed && v.duration > 45 && v.duration < 900
                                             && /youtube\.com|youtu\.be/.test(v.uri));
      if (!vids.length) continue;
      vids.sort(() => Math.random() - .5);
      let vid = null, videoId = null;
      for (const v of vids) {
        const id = (v.uri.match(/(?:v=|youtu\.be\/)([\w-]{11})/) || [])[1];
        if (id && await videoAlive(id)) { vid = v; videoId = id; break; }
      }
      if (!vid) continue;

      const tier = rarityOf(rel);
      current = {
        artist: rel.artists_sort || (rel.artists || []).map(a => a.name).join(', ') || '—',
        title: vid.title,
        release: rel.title,
        year: rel.year || item.year || '—',
        genre: (rel.genres || []).join(', ') || '—',
        style: (rel.styles || []).join(', ') || '—',
        genres: rel.genres || [],
        styles: rel.styles || [],
        country: rel.country || '—',
        label: (rel.labels && rel.labels[0]) ? rel.labels[0].name + (rel.labels[0].catno ? ' — ' + rel.labels[0].catno : '') : '—',
        videoId,
        watchUrl: 'https://www.youtube.com/watch?v=' + videoId,
        discogsUrl: rel.uri,
        cover: item.cover_image && !item.cover_image.includes('spacer.gif') ? item.cover_image : '',
        releaseId: rel.id,
        tier,
        have: (rel.community || {}).have || 0,
        want: (rel.community || {}).want || 0
      };
      await ribbonLand(current, tier);
      play(current);
      pushHistory(current);
      renderMeta(current);
      renderList();
      updateFavBtn();
      pulls++;
      localStorage.setItem('digger_pulls', pulls);
      bump('stat-pulls', pulls);
      streak = (tier === 'epic' || tier === 'legendary') ? streak + 1 : 0;
      bump('stat-streak', streak);
      if (tier === 'legendary') confetti('#ffb930');
      return;
    }
    setStatus('Couldn\'t find a playable video after several tries — hit Dig again.');
    ribbonIdle();
  } catch (e) {
    if (e.message === 'rate') setStatus('Discogs rate limit hit — wait a minute, or paste a free Discogs token (top right) to raise it.');
    else setStatus('Something went wrong talking to Discogs (' + e.message + '). Try again.');
    ribbonIdle();
  } finally {
    digging = false;
    btn.disabled = false;
  }
}
function bump(id, v) {
  const el = $(id);
  el.textContent = v;
  el.animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 280, easing: 'ease-out' });
}

/* Dead YouTube videos serve a 120x90 placeholder thumbnail; live ones are 480x360. */
function videoAlive(id) {
  return new Promise(resolve => {
    const img = new Image();
    const timer = setTimeout(() => resolve(true), 3000);
    img.onload = () => { clearTimeout(timer); resolve(img.naturalWidth > 120); };
    img.onerror = () => resolve(false);
    img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
  });
}

/* ---------- player ---------- */
let digTimer = null;
const DIG_WORDS = ['soul', 'funk', 'jazz', 'disco', 'boogie', 'psych', 'breaks', 'dub', 'latin', 'afrobeat', 'gospel', 'library'];
function setStatus(msg) {
  clearInterval(digTimer);
  $('status').innerHTML = msg;
  $('status').style.display = msg ? 'flex' : 'none';
}
function showDigging() {
  setStatus('<div class="dig-line">digging <span id="dig-word">soul</span>…</div><div>flipping through the crates</div>');
  let i = 0;
  digTimer = setInterval(() => {
    const el = $('dig-word');
    if (el) el.textContent = DIG_WORDS[++i % DIG_WORDS.length];
  }, 130);
}

function play(track) {
  setStatus('');
  updateMediaSession(track);
  if (playerReady) {
    player.loadVideoById(track.videoId);
  } else if (window.YT && YT.Player) {
    player = new YT.Player('yt', {
      videoId: track.videoId,
      playerVars: { autoplay: 1, rel: 0 },
      events: {
        onReady: () => { playerReady = true; },
        onError: onPlayerError
      }
    });
  } else {
    setStatus('YouTube player still loading — one sec…');
    setTimeout(() => play(track), 600);
  }
}
function onPlayerError() {
  setStatus('That video won\'t play — skipping…');
  setTimeout(dig, 400);
}
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);

/* sync the "playing" body class (drives the equalizer) with the player */
setInterval(() => {
  const s = playerReady && player.getPlayerState ? player.getPlayerState() : -1;
  document.body.classList.toggle('playing', s === 1);
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = s === 1 ? 'playing' : 'paused';
  if (silentAudio) {
    if (s === 1) silentAudio.play().catch(() => {});
    else if (s === 2 || s === 0) silentAudio.pause();
  }
}, 800);

/* ---------- media session: lock screen / notification controls ---------- */
let silentAudio = null;
function makeSilentWav(seconds) {
  const rate = 8000, n = rate * seconds;
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE');
  w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function updateMediaSession(t) {
  if (!('mediaSession' in navigator)) return;
  if (!silentAudio) {
    silentAudio = new Audio(makeSilentWav(1));
    silentAudio.loop = true;
  }
  silentAudio.play().catch(() => {});
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title,
    artist: t.artist,
    album: t.release,
    artwork: [{ src: t.cover || ('https://i.ytimg.com/vi/' + t.videoId + '/hqdefault.jpg') }]
  });
  navigator.mediaSession.setActionHandler('play', () => { if (playerReady) player.playVideo(); silentAudio.play().catch(() => {}); });
  navigator.mediaSession.setActionHandler('pause', () => { if (playerReady) player.pauseVideo(); silentAudio.pause(); });
  navigator.mediaSession.setActionHandler('nexttrack', () => dig());
  navigator.mediaSession.setActionHandler('previoustrack', playPrev);
}
function playPrev() {
  if (history.length < 2) return;
  const t = history[1];
  current = t;
  play(t); pushHistory(t); renderMeta(t); renderList(); updateFavBtn();
}

/* ---------- dynamic accent color from the video thumbnail ---------- */
function extractColors(videoId) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = 48; c.height = 27;
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, 48, 27);
      const d = x.getImageData(0, 0, 48, 27).data;
      let best = null, bestScore = -1;
      for (let i = 0; i < d.length; i += 16) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        const score = (mx ? (mx - mn) / mx : 0) * mx;
        if (score > bestScore) { bestScore = score; best = [r, g, b]; }
      }
      setAccent(bestScore > 40 ? best : null);
    } catch (e) { setAccent(null); }
  };
  img.onerror = () => setAccent(null);
  img.src = 'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg';
}
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const dl = mx - mn;
  const s = l > .5 ? dl / (2 - mx - mn) : dl / (mx + mn);
  let h = mx === r ? (g - b) / dl + (g < b ? 6 : 0) : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4;
  return [h * 60, s, l];
}
function setAccent(rgb) {
  const root = document.documentElement.style;
  if (!rgb) { root.removeProperty('--dyn1'); root.removeProperty('--dyn2'); return; }
  const [r, g, b] = rgb;
  const [h, s, l] = rgb2hsl(r, g, b);
  root.setProperty('--dyn1', `hsl(${Math.round(h)} ${Math.round(Math.max(s, .5) * 100)}% ${Math.round(Math.min(Math.max(l, .45), .62) * 100)}%)`);
  root.setProperty('--dyn2', `hsl(${Math.round((h + 45) % 360)} ${Math.round(Math.max(s, .5) * 100)}% 55%)`);
}

/* ---------- metadata ---------- */
function chip(text, hot) {
  const el = document.createElement('span');
  el.className = 'chip' + (hot ? ' hot' : '');
  el.textContent = text;
  return el;
}
function renderMeta(t) {
  $('m-title').textContent = t.title;
  $('m-artist-big').textContent = t.artist;
  const chips = $('m-chips');
  chips.innerHTML = '';
  if (t.year !== '—') chips.appendChild(chip(t.year, true));
  (t.genres || []).forEach(g => chips.appendChild(chip(g)));
  (t.styles || []).forEach(s => chips.appendChild(chip(s)));
  if (t.country !== '—') chips.appendChild(chip(t.country));
  $('m-release').textContent = t.release;
  $('m-label').textContent = t.label;
  $('m-community').textContent = t.have || t.want
    ? `${t.have.toLocaleString()} diggers · ${t.want.toLocaleString()} want it`
    : '—';
  $('m-links').innerHTML =
    '<a href="' + t.discogsUrl + '" target="_blank">Discogs</a> · ' +
    '<a href="' + t.watchUrl + '" target="_blank">YouTube</a>';
  const coverSrc = t.cover || ('https://i.ytimg.com/vi/' + t.videoId + '/hqdefault.jpg');
  $('cover').src = coverSrc;
  $('lt-cover').src = coverSrc;
  const badge = $('tier-badge');
  badge.className = 'tier show ' + (t.tier || 'common');
  badge.textContent = t.tier || 'common';
  updateLowerThird(t);
  extractColors(t.videoId);
  const el = $('meta'); el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
}
function updateLowerThird(t) {
  const inner = $('lt-title-inner');
  const title = t.artist + ' — ' + t.release;
  const wrap = $('lt-title');
  wrap.classList.remove('scroll');
  inner.textContent = title;
  $('lt-sub').textContent = [t.year, t.label, t.genre].filter(v => v !== '—').join(' · ');
  requestAnimationFrame(() => {
    if (inner.scrollWidth > wrap.clientWidth) {
      inner.textContent = title + '   ' + title;
      wrap.style.setProperty('--marquee', Math.max(10, title.length / 4) + 's');
      wrap.classList.add('scroll');
    }
  });
}

/* ---------- history & favorites ---------- */
function pushHistory(t) {
  history = history.filter(h => h.videoId !== t.videoId);
  history.unshift(t);
  if (history.length > 50) history.pop();
}
function isFaved(t) { return t && favs.some(f => f.videoId === t.videoId); }
function toggleFav() {
  if (!current) return;
  if (isFaved(current)) favs = favs.filter(f => f.videoId !== current.videoId);
  else favs.unshift(current);
  localStorage.setItem('digger_favs', JSON.stringify(favs));
  updateFavBtn(); renderList();
  if (isFaved(current)) {
    const b = $('btn-fav');
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  }
  toast(isFaved(current) ? 'Added to favorites' : 'Removed from favorites');
}
function updateFavBtn() {
  $('btn-fav').classList.toggle('faved', isFaved(current));
}
function renderList() {
  const items = activeTab === 'history' ? history : favs;
  const list = $('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">' + (activeTab === 'history' ? 'Nothing dug up yet.' : 'No favorites yet — hit ♥ on a track you like.') + '</div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(t => {
    const el = document.createElement('div');
    el.className = 'track' + (current && t.videoId === current.videoId ? ' now' : '');
    const img = document.createElement('img');
    img.src = t.cover || ('https://i.ytimg.com/vi/' + t.videoId + '/default.jpg');
    img.loading = 'lazy';
    const txt = document.createElement('div');
    const l1 = document.createElement('div'); l1.className = 't'; l1.textContent = t.title;
    const l2 = document.createElement('div'); l2.className = 'a'; l2.textContent = t.artist + ' · ' + t.year;
    txt.append(l1, l2);
    const dot = document.createElement('span');
    dot.className = 'mini-tier';
    dot.style.background = TIER_COLOR[t.tier || 'common'];
    dot.title = t.tier || 'common';
    el.append(img, txt, dot);
    el.onclick = () => { current = t; play(t); pushHistory(t); renderMeta(t); renderList(); updateFavBtn(); };
    list.appendChild(el);
  });
}

/* ---------- tap tempo ---------- */
let taps = [];
function tap() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length > 1) {
    const iv = [];
    for (let i = 1; i < taps.length; i++) iv.push(taps[i] - taps[i - 1]);
    const recent = iv.slice(-8);
    const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
    const bpm = Math.round(60000 / avg);
    $('bpm-val').innerHTML = bpm + ' <small>BPM</small>';
    $('lt-bpm').innerHTML = bpm + ' <small>BPM</small>';
    const pulse = $('bpm-pulse');
    pulse.style.setProperty('--beat', (60 / bpm) + 's');
    pulse.classList.add('beat');
  }
  if (!document.body.classList.contains('stream')) $('bpm-box').classList.add('open');
}
$('btn-tap').onclick = tap;
$('btn-tap-reset').onclick = () => {
  taps = [];
  $('bpm-val').innerHTML = '— <small>BPM</small>';
  $('lt-bpm').innerHTML = '— <small>BPM</small>';
  $('bpm-pulse').classList.remove('beat');
};

/* ---------- confetti (legendary pulls only) ---------- */
const cv = $('fx'), cx = cv.getContext('2d');
function sizeFx() { cv.width = innerWidth; cv.height = innerHeight; }
sizeFx(); addEventListener('resize', sizeFx);
let parts = [];
function confetti(color) {
  if (reduceMotion) return;
  const colors = [color, '#7c5cff', '#4d9fff', '#ffffff'];
  for (let i = 0; i < 120; i++) parts.push({
    x: innerWidth / 2 + (Math.random() - .5) * 400, y: innerHeight * .3,
    vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 2,
    s: Math.random() * 5 + 3, c: colors[i % colors.length],
    r: Math.random() * Math.PI, life: 1
  });
  requestAnimationFrame(fxTick);
}
function fxTick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .32; p.r += .09; p.life -= .009;
    cx.save(); cx.globalAlpha = Math.max(0, p.life);
    cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .62);
    cx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 30);
  if (parts.length) requestAnimationFrame(fxTick);
  else cx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------- ui wiring ---------- */
function togglePlay() {
  if (!playerReady || !current) return;
  if (player.getPlayerState() === 1) {
    player.pauseVideo();
    document.body.classList.remove('playing');
  } else {
    player.playVideo();
    document.body.classList.add('playing');
  }
}
$('btn-play').onclick = togglePlay;
$('btn-random').onclick = dig;
$('btn-filters').onclick = () => $('filters').classList.toggle('open');
$('btn-tempo').onclick = () => $('bpm-box').classList.toggle('open');
$('btn-fav').onclick = toggleFav;
$('btn-copy').onclick = () => {
  if (!current) return;
  navigator.clipboard.writeText(current.watchUrl).then(() => toast('YouTube link copied'));
};
$('btn-stream').onclick = toggleStream;
function toggleStream() {
  const on = document.body.classList.toggle('stream');
  toast(on ? 'Stream mode on — V to exit' : 'Stream mode off');
}
$('tab-history').onclick = () => switchTab('history');
$('tab-favs').onclick = () => switchTab('favs');
function switchTab(t) {
  activeTab = t;
  $('tab-history').classList.toggle('active', t === 'history');
  $('tab-favs').classList.toggle('active', t === 'favs');
  renderList();
}

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  else if (k === 'd') dig();
  else if (k === 'r') tap();
  else if (k === 's') $('filters').classList.toggle('open');
  else if (k === 'c') $('btn-copy').click();
  else if (k === 'f') toggleFav();
  else if (k === 'v') toggleStream();
});
</script>
